<svg xmlns="http://www.w3.org/2000/svg" width="900" height="631"><rect width="100%" height="100%" fill="white"/><text x="450" y="22" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Smart Campus Management — Flowchart</text><rect x="100" y="38" width="700" height="48" rx="24" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="450" y="68" text-anchor="middle" font-family="Arial" font-size="17" fill="#0f172a">START</text><path d="M450 86 V106 m-6 -7 l6 7 6 -7" stroke="#334155" stroke-width="2" fill="none"/><rect x="100" y="110" width="700" height="48" rx="9" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="450" y="140" text-anchor="middle" font-family="Arial" font-size="17" fill="#0f172a">Initialize student records and event lists</text><path d="M450 158 V178 m-6 -7 l6 7 6 -7" stroke="#334155" stroke-width="2" fill="none"/><rect x="100" y="182" width="700" height="48" rx="9" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="450" y="212" text-anchor="middle" font-family="Arial" font-size="17" fill="#0f172a">Display menu inside a loop</text><path d="M450 230 V250 m-6 -7 l6 7 6 -7" stroke="#334155" stroke-width="2" fill="none"/><rect x="100" y="254" width="700" height="48" rx="9" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="450" y="284" text-anchor="middle" font-family="Arial" font-size="17" fill="#0f172a">Read and validate menu choice</text><path d="M450 302 V322 m-6 -7 l6 7 6 -7" stroke="#334155" stroke-width="2" fill="none"/><rect x="100" y="326" width="700" height="48" rx="9" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="450" y="356" text-anchor="middle" font-family="Arial" font-size="17" fill="#0f172a">Process student view, attendance, registration or summary</text><path d="M450 374 V394 m-6 -7 l6 7 6 -7" stroke="#334155" stroke-width="2" fill="none"/><rect x="100" y="398" width="700" height="48" rx="9" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="450" y="428" text-anchor="middle" font-family="Arial" font-size="17" fill="#0f172a">Prevent unknown IDs and duplicate registrations</text><path d="M450 446 V466 m-6 -7 l6 7 6 -7" stroke="#334155" stroke-width="2" fill="none"/><rect x="100" y="470" width="700" height="48" rx="9" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="450" y="500" text-anchor="middle" font-family="Arial" font-size="17" fill="#0f172a">Repeat until Exit is selected</text><path d="M450 518 V538 m-6 -7 l6 7 6 -7" stroke="#334155" stroke-width="2" fill="none"/><rect x="100" y="542" width="700" height="48" rx="24" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="450" y="572" text-anchor="middle" font-family="Arial" font-size="17" fill="#0f172a">STOP</text></svg>